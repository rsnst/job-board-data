name: scrape-jobs

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Scrape boards
        env:
          SCRAPE_WORKERS: "24"
          PL_CONCURRENCY: "8"
        run: python scraper.py
      - name: Commit results
        run: |
          git config user.name "job-board-bot"
          git config user.email "job-board-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update job data $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              sleep 15
            done
          fi
